name: Publish astyle-check image

on:
  push:
    branches:
      - main
    paths:
      - 'astyle-check/**'
      - '.github/workflows/publish-astyle-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ASTYLE_VERSION: '3.1'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/actions/astyle-check

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./astyle-check
          push: true
          build-args: |
            ASTYLE_VERSION=${{ env.ASTYLE_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.ASTYLE_VERSION }}
            ${{ env.IMAGE_NAME }}:latest
